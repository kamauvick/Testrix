name: Bug report
description: Something Testrix CLI did wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
      placeholder: |
        $ testrix --project ... --dry-run
        Expected: ...
        Got: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: testrix version
      description: Output of `testrix --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version & OS
      placeholder: node 20.11 / Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report format
      description: Which tool produced the report (Playwright junit, JMeter .jtl, ...)? A small anonymised sample helps a lot.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Re-run with `TESTRIX_LOG_LEVEL=debug` and paste the output. Redact any API keys.
      render: shell
